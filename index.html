var es=sid?S.subs.find(function(x){return x.id===sid}):null,t=es&&id?es.todos.find(function(x){return x.id===id}):null,lock=t&&evOf(es,t),sel=es?es.id:V.s,c=t?t.c:S.cc;
mod('<h2>'+(t?'Editar pendiente':'Nuevo pendiente')+'</h2><label>¿Qué tienes que hacer?</label><input id="f1" value="'+(t?esc(t.n):'')+'" placeholder="Ej. Parcial de la unidad 2" style="width:100%">'
+'<label>Materia</label><select id="f2" style="width:100%"'+(t?' disabled':'')+'>'+S.subs.map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select>'
+'<label>Fecha (opcional)</label><input id="f3" type="date" value="'+(t?t.d:'')+'" style="width:100%">'
+'<label>¿En qué '+CFG.u+' cuenta?</label><select id="f4" style="width:100%"'+(lock?' disabled':'')+'>'+S.cortes.map(function(x,k){return '<option value="'+k+'"'+(k===c?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'
+'<label>¿Cuánto vale dentro del '+CFG.u+'? (%) Opcional</label><input id="f5" inputmode="decimal" value="'+(t&&t.w?t.w:'')+'" placeholder="Ej. 20" style="width:100%"'+(lock?' disabled':'')+'>'
+'<p class="mu" style="margin:8px 0 0">'+(lock?'Este pendiente ya tiene nota registrada, por eso no se puede cambiar su valor.':'Si le pones valor, cuando llegue la fecha podrás registrar la nota desde aquí y se sumará a tus cálculos.')+'</p><div id="me" class="msg no" style="display:none"></div>'
+'<div class="row"><button class="g" onclick="cm()">Cancelar</button><button onclick="savePen('+(t?sid+','+id:'0,0')+')">Guardar</button></div>')}
function savePen(sid,id){var n=$("f1").value.trim();if(!n){err("Escribe qué tienes que hacer");return}
var s=sid?S.subs.find(function(x){return x.id===sid}):S.subs.find(function(x){return x.id===+$("f2").value}),t=id?s.todos.find(function(x){return x.id===id}):null,
c=+$("f4").value,w=String($("f5").value).trim()===""?0:num($("f5").value);
if(t&&evOf(s,t)){c=t.c;w=t.w}
else{if(isNaN(w)||w<0||w>100){err("El porcentaje debe estar entre 0 y 100");return}
if(w>0){var left=100-ucw(s,c,-1)-resv(s,c,t?t.id:0);if(w>left+0.0001){err("En este "+CFG.u+" solo te queda "+f(left)+"% por repartir.");return}}}
var o=t||{id:Date.now(),x:false};o.n=n;o.d=$("f3").value||"";o.w=w;o.c=c;if(!t)s.todos.push(o);save();cm();render()}
function modGrade(sid,id){var s=S.subs.find(function(x){return x.id===sid}),t=s.todos.find(function(x){return x.id===id});
mod('<h2>Poner nota</h2><p class="mu" style="margin:0">'+esc(t.n)+' ('+esc(s.name)+'). Vale '+t.w+'% del '+CFG.u+' «'+esc(S.cortes[t.c])+'».</p><label>¿Qué nota sacaste? (0 a '+MX()+')</label><input id="f1" inputmode="decimal" placeholder="Ej. 3.5" style="width:100%"><div id="me" class="msg no" style="display:none"></div><div class="row"><button class="g" onclick="cm()">Cancelar</button><button onclick="saveGrade('+sid+','+id+')">Guardar nota</button></div>')}
function saveGrade(sid,id){var s=S.subs.find(function(x){return x.id===sid}),t=s.todos.find(function(x){return x.id===id}),g=num($("f1").value);
if(isNaN(g)||g<0||g>MX()){err("La nota debe estar entre 0 y "+MX());return}
if(!(S.cv[t.c]>0)){err("Primero dale un valor a este "+CFG.u+" en Ajustes.");return}
if(ucw(s,t.c,-1)+t.w>100.0001){err("En este "+CFG.u+" ya no hay espacio para este porcentaje. Revisa las notas registradas.");return}
s.evals.push({n:t.n,g:g,w:t.w,c:t.c,t:t.id});t.x=true;S.cc=t.c;save();cm();render()}
function tg(sid,id){var s=S.subs.find(function(x){return x.id===sid}),t=s.todos.find(function(x){return x.id===id});t.x=!t.x;save();render()}
function dp(sid,id){var s=S.subs.find(function(x){return x.id===sid});s.todos=s.todos.filter(function(x){return x.id!==id});save();render()}
function note(m,ok){var e=$("bm");if(!e)return;e.className="msg "+(ok?"ok":"no");e.textContent=m;e.style.display="block"}
async function exportData(){var j=JSON.stringify(S,null,1),fn=CFG.cred?"mis-notas-respaldo.json":"mis-notas-colegio-respaldo.json";
try{var d=window.claude&&claude.use?await claude.use("downloads"):null;
if(!d){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();note("Copia guardada: "+fn,true);return}
await d.save({filename:fn,data:j});note("Copia guardada: "+fn,true)}catch(e){if(e&&e.code==="declined")return;note("No se pudo guardar la copia",false)}}
function applyImport(){if(!PEND)return;S=PEND;PEND=null;S.ob=true;V={t:"aj",s:null};save();render();note("Copia restaurada",true)}
function importData(e){var fl=e.target.files[0];if(!fl)return;var rd=new FileReader();
rd.onload=function(){try{var o=conv(JSON.parse(rd.result));if(!o)throw 0;PEND=o;ask("El archivo tiene "+o.subs.length+" materia(s). Esto reemplaza tus datos actuales. ¿Continuar?","Restaurar",applyImport)}catch(x){note("El archivo no es un respaldo válido",false)}};
rd.readAsText(fl);e.target.value=""}
$("imp").addEventListener("change",importData);
document.addEventListener("click",function(e){var b=e.target.closest("#pf button");if(!b)return;var k=b.getAttribute("data-k"),v=b.getAttribute("data-v");
if(k==="reset"){PF={theme:"auto",ac:"",size:16};THO=false;ACO=false}else if(k==="thmenu"){THO=!THO}else if(k==="acmenu"){ACO=!ACO}else if(k==="theme"){PF.theme=v;THO=false}else{PF[k]=(k==="size"?parseInt(v,10):v);if(k==="ac")ACO=false}
savePF();applyPF();renderPF()});
render();</script>
